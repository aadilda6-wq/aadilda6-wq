name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: aadilda6-wq
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy generated snake
        run: |
          mkdir -p output
          cp dist/github-contribution-grid-snake.svg output/github-contribution-grid-snake.svg
          cp dist/github-contribution-grid-snake-dark.svg output/github-contribution-grid-snake-dark.svg

      - name: Commit generated snake
        uses: EndBug/add-and-commit@v9
        with:
          add: "output/*.svg"
          message: "chore: update contribution snake"
